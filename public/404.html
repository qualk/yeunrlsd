<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="The page you're looking for doesn't exist.">
  <link rel="icon" type="image/x-icon" href="/icons/404.ico">
  <title>404s & Heartbreak</title>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="error-404" role="main" aria-labelledby="error-title">
    <div class="vinyl-container" aria-hidden="true">
      <svg class="vinyl-record" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Outer vinyl body -->
        <circle cx="100" cy="100" r="95" fill="#1a1a1a" stroke="#000" stroke-width="2" />

        <!-- Vinyl grooves -->
        <circle cx="100" cy="100" r="85" fill="none" stroke="#333" stroke-width="1" opacity="0.5" />
        <circle cx="100" cy="100" r="75" fill="none" stroke="#333" stroke-width="1" opacity="0.5" />
        <circle cx="100" cy="100" r="65" fill="none" stroke="#333" stroke-width="1" opacity="0.5" />
        <circle cx="100" cy="100" r="55" fill="none" stroke="#333" stroke-width="1" opacity="0.5" />
        <circle cx="100" cy="100" r="45" fill="none" stroke="#333" stroke-width="1" opacity="0.5" />

        <!-- Centre label -->
        <circle cx="100" cy="100" r="40" fill="#e8e8e8" stroke="#000" stroke-width="1.5" />
        <circle cx="100" cy="100" r="30" fill="#f5f5f5" />

        <!-- Label text -->
        <text x="100" y="130" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14"
          font-weight="600" fill="#000" transform="rotate(180 100 120)">404</text>
        <text x="100" y="90" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14"
          font-weight="600" fill="#000">404</text>

        <!-- Centre hole -->
        <circle cx="100" cy="100" r="6" fill="#000" />
      </svg>
    </div>

    <div class="error-content">
      <h1 id="error-title">404s & Heartbreak</h1>
      <p>Better luck next time.</p>
      <p class="error-code" aria-live="polite">ERROR 404</p>
      <a href="/" class="back-home-btn" role="button" aria-label="Return to home page">RETURN TO DROAM</a>
    </div>
  </div>
</body>
</html>
